name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate repository, Git policy, lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run validate:git
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: build-placeholder
          GITHUB_APP_ID: "1"
          GITHUB_APP_SLUG: hamster-algorithm
          GITHUB_APP_PRIVATE_KEY: build-placeholder
          GITHUB_WEBHOOK_SECRET: build-placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      - run: npm test
